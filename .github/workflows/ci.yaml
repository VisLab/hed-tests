name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  test-suite-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate test structure (validation tests)
        run: |
          python src/scripts/validate_test_structure.py json_test_data/validation_test_data

      - name: Validate test structure (schema tests)
        run: |
          python src/scripts/validate_test_structure.py json_test_data/schema_test_data

      - name: Check test coverage
        run: |
          python src/scripts/check_coverage.py

      - name: Generate test index
        run: |
          python src/scripts/generate_test_index.py

      - name: Run consolidation script
        run: |
          python src/scripts/consolidate_tests.py

      - name: Run test utilities
        run: |
          python -m unittest discover tests
