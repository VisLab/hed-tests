name: CI Windows

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-suite-validation-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate test structure (validation tests)
        run: |
          python src/scripts/validate_test_structure.py json_test_data/validation_test_data
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate test structure (schema tests)
        run: |
          python src/scripts/validate_test_structure.py json_test_data/schema_test_data
        env:
          PYTHONIOENCODING: utf-8

      - name: Check test coverage
        run: |
          python src/scripts/check_coverage.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Run test utilities
        run: |
          python -m unittest discover tests
        env:
          PYTHONIOENCODING: utf-8
