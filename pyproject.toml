[project]
name = "hed-tests"
version = "1.0.0"
description = "Official JSON test suite for HED (Hierarchical Event Descriptors) validation across all validator implementations."
readme = "README.md"
authors = [
    { name = "VisLab" },
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
maintainers = [
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
license = {text = "MIT"}
keywords = ["HED", "hierarchical event descriptors", "testing", "validation", "test suite", "neuroscience", "BIDS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.10"

# Minimal dependencies - this is a test data repository, not a validator
dependencies = [
    "jsonschema>=4.23.0",
]

[project.urls]
"Homepage" = "https://www.hedtags.org/"
"Documentation" = "https://hed-tests.readthedocs.io/"
"Repository" = "https://github.com/hed-standard/hed-tests/"
"Bug Tracker" = "https://github.com/hed-standard/hed-tests/issues"
"HED Specification" = "https://github.com/hed-standard/hed-specification"
"HED Resources" = "https://www.hedtags.org/hed-resources/"
"Python Validator" = "https://github.com/hed-standard/hed-python"
"JavaScript Validator" = "https://github.com/hed-standard/hed-javascript"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]
docs = [
    "sphinx>=7.1.0,<10.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0,<3.12.1",
    "linkify-it-py>=2.0.3",
]

[tool.typos.files]
extend-exclude = [
    "*.pdf",
    "*.svg",
    "*.tsv",
    "*.json",
    "*.rdf",
    "*.jsonld",
    "*.xml",
    "*.mediawiki",
    "*.omn",
    "deprecated",
]

[tool.typos.default.extend-words]
covert = "covert"
hed = "hed"
recuse = "recuse"
disjointness = "disjointness"
parms = "parms"
te = "te"
assertIn = "assertIn"

[tool.ruff]
# Target Python 3.10+
target-version = "py310"
line-length = 127

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".status",  # Local gitignored notes; scratch/ may hold throwaway .py files
    "json_test_data",  # Test data, not code
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# Allow unused imports in __init__.py files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["hed"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Excludes and line-length are inherited from [tool.ruff]
